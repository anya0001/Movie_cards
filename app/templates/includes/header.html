<header class="header">
    <a href="{{ url_for('main.home') }}" class="logo">
        <svg class="logo-svg" width="42" height="auto" viewBox="0 0 80 80">
            <defs>
                <linearGradient id="netflixRed" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#e50914" />
                    <stop offset="100%" stop-color="#b00610" />
                </linearGradient>
            </defs>

            <text x="0" y="62" font-size="72" font-weight="900" font-family="Arial Black, Impact, sans-serif"
                fill="url(#netflixRed)" letter-spacing="-6">
                M
            </text>
        </svg>
        <span class="logo-word">MovieCards</span>
    </a>

    <form class="header-search" id="siteSearchForm" action="{{ url_for('main.categories_page') }}" method="GET" autocomplete="off">
        <button type="submit" class="search-submit-btn" title="Search">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        <input type="text" name="q" id="siteSearchInput" placeholder="Search movies…" autocomplete="off">
        <div class="search-suggestions is-hidden" id="searchSuggestions"></div>
    </form>

    <nav class="actions">
        <a href="{{ url_for('main.home') }}" class="nav-link {{ 'active' if request.endpoint == 'main.home' }}">
            <i class="fa-solid fa-compass"></i><span class="nav-label">Discover</span>
        </a>

        <a href="{{ url_for('main.categories_page') }}" class="nav-link {{ 'active' if request.endpoint == 'main.categories_page' }}">
            <i class="fa-solid fa-layer-group"></i><span class="nav-label">Categories</span>
        </a>

        <a href="{{ url_for('main.liked_page') }}" class="nav-link {{ 'active' if request.endpoint == 'main.liked_page' }}">
            <i class="fa-solid fa-heart"></i><span class="nav-label">Watchlist</span>
        </a>

        {% if session.get('is_admin') %}
        <a href="{{ url_for('admin.dashboard') }}" class="nav-link {{ 'active' if request.endpoint and request.endpoint.startswith('admin.') }}">
            <i class="fa-solid fa-gauge"></i><span class="nav-label">Dashboard</span>
        </a>
        {% endif %}
    </nav>
</header>
